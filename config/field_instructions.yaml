# Natural language interpretation instructions for each field
# Used by the instruction processing agent to understand user intent

# Growth Fields
1year_annual_EPS_growth: |
  1Y Annual EPS Growth
  1Y Annual EPS Growth
  EPS growth over the latest fiscal year.
  • Large Gain > 30% for “strong recent growth.”
  • Positive > 0% for modest growth.
  • Negative < 0% for shrinking EPS.
  • Large Loss < -30% for turnarounds.

1year_annual_revenue_growth: |
  1Y Annual Revenue Growth
  1Y Annual Revenue Growth
  Revenue growth in the most recent fiscal year.
  • Large Gain > 30% for “rapid recent sales growth.”
  • Positive > 0% for “growing.”
  • Negative < 0% for “shrinking.”
  • Large Loss < -30% for steep drop.

5year_annual_total_EPS_growth: |
  5Y Annual EPS Growth
  5Y Annual EPS Growth
  Compound EPS growth over five years—signals durable earnings trajectory.
  • Large Gain > 100% for “multi-bagger earnings.”
  • Positive > 0% for “steady long-term growth.”
  • Negative < 0% for “earnings erosion.”
  • Large Loss < -50% for “major decline.”

5year_annual_total_revenue_growth: |
  5Y Annual Revenue Growth
  5Y Annual Revenue Growth
  Five-year compound sales growth—structural demand signal.
  • Large Gain > 100% for “explosive long-term sales growth.”
  • Positive > 0% for healthy trend.
  • Negative < 0% for declining business.
  • Large Loss < -50% for severe long-term contraction.

year_over_year_quarterly_eps_growth: |
  YoY Quarterly EPS Growth
  YoY Quarterly EPS Growth
  Growth of EPS versus same quarter last year.
  • Large Gain > 30% for “explosive earnings growth.”
  • Positive > 0% for “growing earnings” or neutral.
  • Negative < 0% for “declining earnings.”
  • Large Loss < -30% for “massive EPS drop” or turnarounds.

year_over_year_quarterly_revenue_growth: |
  YoY Quarterly Revenue Growth
  YoY Quarterly Revenue Growth
  Revenue growth versus same quarter last year.
  • Large Gain > 30% for “hyper-growth sales.”
  • Positive > 0% for “growing sales.”
  • Negative < 0% for “shrinking sales.”
  • Large Loss < -30% for “severe revenue decline.”

# Other Fields
is_ticker_in_sp500, is_ticker_in_dow, is_ticker_in_nasdaq: |
  Index
  Index
  Filters membership in major U.S. indices.
  • Pick S&P 500 if the user says “S&P,” “large-cap benchmark,” or “broad market.”
  • Pick Nasdaq for “Nasdaq,” “tech-heavy,” or “growth index.”
  • Pick Dow Jones for “Dow,” “blue-chips,” or “industrial average.”

# Overview Fields
average_consensus_analyst_ratings: |
  Consensus Analyst Rating
  Consensus Analyst Rating
  Aggregated Wall-Street stance on the stock.
  • Buy for “bullish,” “analysts positive,” or “favorable rating.”
  • Hold for “neutral,” “wait-and-see,” or no opinion.
  • Sell for “bearish,” “analysts negative,” or “avoid.”

average_volume: |
  Average Volume
  Average Volume
  Average daily shares traded—liquidity proxy.
  • Over 10 M for “very liquid,” “institutional,” or “high volume.”
  • Over 1 M for “liquid” or no preference.
  • Over 100 K for “less liquid but tradable.”
  • Under 100 K for “illiquid,” “thinly traded,” or “micro-cap curiosity.”

beta: |
  Beta
  Beta
  Measures share-price volatility relative to the market (S&P 500).
  • Low < 0.8 for “defensive,” “low volatility,” or “stable.”
  • Market-Neutral 0.8–1.2 when no volatility preference is given.
  • High > 1.2 for “volatile,” “aggressive,” or “high-beta.”
  • Negative < 0 for “inverse correlation” or “market hedge.”

company_country: |
  Country
  Country
  Headquarters or primary listing country.
  • Translate any country reference—full name, abbreviation, 3-letter code, or demonym—into its two-letter ISO 3166-1 alpha-2 code, and use that code as the filter value (e.g., “United States,” “USA,” “U.S.” → US; “Canada,” “CA” → CA; “Japan,” “JP” → JP).
  
  • If the user requests “domestic,” substitute the code that matches the user’s locale; otherwise leave this filter unset.

company_sector: |
  Sector
  Sector
  Economic industry grouping.
  • Match the user’s stated sector (“Technology,” “Healthcare,” etc.) to the identical dropdown value.
  • If the user says “diversified” or gives no sector, leave this filter unset.

exchange_acronym: |
  Exchange
  Exchange
  Primary listing venue.
  • Map the user’s explicit mention (“NYSE,” “Nasdaq,” “TSX,” etc.) directly to the matching dropdown option.
  • If the user asks for “U.S.-listed,” default to NYSE plus Nasdaq (apply both filters if multiple selection is allowed).

market_capitalization: |
  Market Cap
  Market Cap
  Equity valuation band.
  • Mega-Cap ≥ $200 B for “mega,” “FAANG-size,” or “largest.”
  • Large-Cap $10–200 B for “large cap” or “established.”
  • Mid-Cap $2–10 B for “mid cap,” “SMID,” or neutral size.
  • Small-Cap $300 M–2 B for “small cap” or “emerging.”
  • Micro-Cap < $300 M for “micro cap,” “speculative,” or “tiny.”

ttm_dividend_yield: |
  Dividend Yield
  Dividend Yield
  Annual dividends per share divided by price—shows income return.
  • High Yield > 5% for “high dividend,” “income,” or “yield play.”
  • Moderate 2–4% for “steady income” or no preference.
  • Paying Dividends > 0% for “any dividend.”
  • No Dividend 0% for “growth only” or “no dividend.”

# Profitability Fields
ttm_ebit_margin: |
  EBIT Margin
  EBIT Margin
  EBIT divided by revenue—similar to operating margin but after depreciation & amortization.
  • High > 20% when user requests “robust EBIT margin.”
  • Moderate 11–20% for neutral requests.
  • Low 0–10% for “low EBIT.”
  • Negative < 0% for loss situations.

ttm_ebitda_margin: |
  EBITDA Margin
  EBITDA Margin
  EBITDA divided by revenue—shows cash-operating profitability, independent of capital structure.
  • High > 30% for “strong cash margins.”
  • Moderate 16–30% for neutral requests.
  • Low 0–15% for “low cash margin.”
  • Negative < 0% for negative EBITDA.

ttm_gross_profit_margin: |
  Gross Profit Margin
  Gross Profit Margin
  Revenue minus cost of goods sold, as a percentage of revenue—measures product-level pricing power.
  • High > 60% for “high gross margin” or “premium pricing.”
  • Moderate 30–59% for “steady” or no preference.
  • Low 0–29% for “commodity-like,” “low margin.”
  • Negative < 0% for firms selling below cost.

ttm_net_profit_margin: |
  Net Profit Margin
  Net Profit Margin
  Percentage of revenue that ultimately becomes net income—captures overall profitability after all costs and taxes.
  • If the user asks for “high margin,” “very profitable,” or “efficient operators,” choose High > 25%.
  • If the user wants “solid” or “average” profitability (or gives no preference), choose Moderate 11–25%.
  • If the user mentions “thin margins” or “low profitability,” choose Low 0–10%.
  • For “unprofitable” or “loss-making” firms, choose Negative < 0%.

ttm_operating_profit_margin: |
  Operating Profit Margin
  Operating Profit Margin
  Operating income as a share of revenue—shows core operating efficiency before interest and taxes.
  • High > 20% for “strong operations” or “wide operating margin.”
  • Moderate 11–20% for “average” or unspecified.
  • Low 0–10% for “low margin.”
  • Negative < 0% for “operating losses.”

ttm_return_on_assets: |
  Return on Assets
  Return on Assets (ROA)
  Net income relative to total assets—gauges how effectively the company turns assets into profit.
  • High > 25% for “asset-light, very efficient.”
  • Moderate 11–25% for “healthy” or no preference.
  • Low 0–10% for “low ROA.”
  • Negative < 0% for “asset-destroying” or loss-making.

ttm_return_on_equity: |
  Return on Equity
  Return on Equity (ROE)
  Net income relative to shareholders’ equity—high values indicate attractive returns for owners.
  • High > 25% for “high ROE” or “shareholder-efficient.”
  • Moderate 11–25% for average.
  • Low 0–10% for “low ROE.”
  • Negative < 0% for negative equity returns.

# Quality Fields
ttm_debt_to_equity_ratio: |
  Debt to Equity Ratio
  Debt to Equity Ratio
  Total debt relative to shareholders’ equity.
  • No Debt 0 for “debt-free.”
  • Low 0–0.5 for “conservative leverage.”
  • Moderate 0.5–1.5 when no leverage preference.
  • High > 1.5 for “highly leveraged,” “aggressive capital structure.”

ttm_free_cash_flow_yield: |
  Free Cash Flow Yield
  Free Cash Flow Yield
  Free cash flow per share divided by price—income available to owners.
  • High > 8% for “cash cow,” “strong cash yield,” or “undervalued on cash.”
  • Moderate 4–8% for neutral/no preference.
  • Low 0–4% for “low yield” or growth focus.
  • Positive > 0% guarantees they at least generate cash;
  • Negative < 0% if the user explicitly wants “cash-burning” firms.

ttm_interest_coverage_ratio: |
  Interest Coverage Ratio
  Interest Coverage Ratio
  EBIT divided by interest expense—tests ability to service debt.
  • Exceptional > 10 for “zero default risk,” “excellent coverage.”
  • Strong 6–10 for “comfortably covers interest.”
  • Moderate 2–5 for neutral or average.
  • High Risk < 2 for “highly leveraged,” “debt issues,” or “distressed.”

ttm_return_on_invested_capital: |
  Return on Invested Capital
  Return on Invested Capital (ROIC)
  Profit generated per dollar of capital (debt+equity)—hallmark of economic moat.
  • Exceptional > 30% for “high ROIC,” “moat companies.”
  • High 15–30% for “strong returns.”
  • Moderate 5–15% for no preference.
  • Low < 5% for “low returns” or “capital-intensive.”

ttm_solvency_ratio: |
  Solvency Ratio
  Solvency Ratio
  Share of total assets financed by equity; higher = safer long-term solvency.
  • Strong > 60% for “conservative balance sheet,” “low leverage.”
  • Healthy 40–60% for average or no preference.
  • Moderate 20–40% for “leveraged but acceptable.”
  • Risky < 20% for “high leverage,” “risky.”

# Returns Fields
price_change_10year_percentage: |
  10Y Price Return
  10-Year Price Return
  Very long-term trend, capturing one full market decade.
  • “Decade-long winners”, “structural outperformers” → Large Gain > 500 %.
  • Positive (no magnitude) → Positive > 0 %.
  • “Decade-long underperformers” → Negative < 0 %.
  • “Major decade-long decline” → Large Loss < -80 %.

price_change_1month_percentage: |
  1M Price Return
  1-Month Price Return
  Captures momentum over roughly 22 trading days (one calendar month).
  • “Recent winners”, “1-month strength”, “short-term rally” → Large Gain > 30 %.
  • “Positive momentum” (no magnitude) → Positive > 0 %.
  • “Losers”, “pullback”, “dip” → Negative < 0 %.
  • “Big monthly drop”, “oversold” → Large Loss < -30 %.

price_change_1year_percentage: |
  1Y Price Return
  1-Year Price Return
  • “12-month winners”, “strong annual performance” → Large Gain > 40 %.
  • Positive (no magnitude) → Positive > 0 %.
  • “Annual underperformers”, “losers over the last year” → Negative < 0 %.
  • “Big annual drop” → Large Loss < -40 %.

price_change_3year_percentage: |
  3Y Price Return
  3-Year Price Return
  Multi-year trend that smooths out short-term noise.
  • “Multi-year winners”, “long-term outperformers” → Large Gain > 100 %.
  • Generic positive → Positive > 0 %.
  • “Underperforming the last few years” → Negative < 0 %.
  • “Significant long-term decline” → Large Loss < -60 %.

price_change_5day_percentage: |
  5D Price Return
  5-Day Price Return
  Tracks very short-term momentum over the last week (≈5 trading days).
  • If user asks for “recent winners”, “short-term momentum”, “bullish breakout”, set Large Gain > 20 %.
  • If user asks for “positive momentum” without strength qualifiers, set Positive > 0 %.
  • If user asks for “recent losers”, “dip buy”, “pullback”, set Negative < 0 %.
  • If user wants “big sell-offs” or “oversold”, set Large Loss < -20 %.

price_change_5year_percentage: |
  5Y Price Return
  5-Year Price Return
  Shows sustained performance over a typical investment cycle.
  • “Five-year compound winners”, “secular strength” → Large Gain > 250 %.
  • Positive wording → Positive > 0 %.
  • “Five-year laggards”, “long-term losers” → Negative < 0 %.
  • “Severe long-term drop” → Large Loss < -70 %.

price_change_6month_percentage: |
  6M Price Return
  6-Month Price Return
  Shows medium-term trend over half a year.
  • “Strong momentum”, “six-month winner”, “mid-term strength” → Large Gain > 40 %.
  • Generic positive wording → Positive > 0 %.
  • “Underperformers”, “laggards”, “mid-term weakness” → Negative < 0 %.
  • “Deeply sold off”, “big drop” → Large Loss < -40 %.

price_change_yeartodate_percentage: |
  YTD Price Return
  YTD Price Return
  Performance from January 1 to today; useful for calendar-year context.
  • “Year-to-date winners”, “market leaders this year” → Large Gain > 20 %.
  • Positive YTD with no strength cue → Positive > 0 %.
  • “YTD laggards”, “this year’s losers” → Negative < 0 %.
  • “Heavy YTD sell-off” → Large Loss < -20 %.

# Valuation Fields
ttm_ev_to_ebitda: |
  EV/EBITDA
  EV/EBITDA
  Compares enterprise value to operating cash earnings; useful across different capital structures—lower may signal bargain pricing.
  • If user requests ‘undervalued’, ‘cheap’, or ‘value’, set the filter to Under 5.
  • If user requests ‘fair value’, apply > 8 and < 12 in the same filter.
  • If user requests ‘high-valuation’ or ‘over-valued’, set the filter to > 20.

ttm_ev_to_sales: |
  EV/Sales
  EV/Sales Ratio
  Expresses a company’s total valuation (enterprise value) relative to its annual revenue; lower multiples mean investors are paying less for each dollar of sales.
  • If user requests ‘undervalued’, ‘cheap’, or ‘value’, set the filter to Under 2 (captures the lowest threshold available).
  • If user requests ‘fair value’ (or gives no valuation preference), apply > 3 and < 6 together in the same filter (targets a moderate, mid-range multiple).
  • If user requests ‘high-valuation’ or ‘over-valued’, set the filter to > 20 (identifies stocks trading at very rich sales multiples).

ttm_price_to_book_ratio: |
  P/B Ratio
  P/B Ratio
  Shows how much investors pay for each dollar of book value (assets – liabilities); lower values often highlight balance-sheet bargains.
  • If user requests ‘undervalued’, ‘cheap’, or ‘value’, set the filter to Under 1.
  • If user requests ‘fair value’, apply > 2 and < 3 in the same filter.
  • If user requests ‘high-valuation’ or ‘over-valued’, set the filter to > 10.

ttm_price_to_earnings_ratio: |
  P/E Ratio
  P/E Ratio
  Measures price relative to earnings; a classic valuation gauge where lower numbers suggest a cheaper profit multiple.
  • If user requests ‘undervalued’, ‘cheap’, or ‘value’, set the filter to Under 10.
  • If user requests ‘fair value’, apply > 15 and < 20 in the same filter.
  • If user requests ‘high-valuation’ or ‘over-valued’, set the filter to > 20.

ttm_price_to_free_cash_flow_ratio: |
  P/FCF Ratio
  Lower values imply more attractive (cheaper) valuation
  
  - If user requests **“undervalued”, “cheap”,** or **“value”**, pick the lowest threshold available (e.g., **“Under 5”** or **“Under 10”**).
  - If user requests **“fair value”** or gives no valuation preference, choose a mid-range threshold (e.g., **“Under 20”**).
  - If user requests **“high-valuation”** or **“over-valued”**, set the filter to **“> 20”**

ttm_price_to_sales_ratio: |
  P/S Ratio
  P/S Ratio
  Indicates how much the market pays for each dollar of revenue; low readings can flag inexpensive sales multiples.
  • If user requests ‘undervalued’, ‘cheap’, or ‘value’, set the filter to Under 1.
  • If user requests ‘fair value’, apply > 2 and < 4 in the same filter.
  • If user requests ‘high-valuation’ or ‘over-valued’, set the filter to > 10.
