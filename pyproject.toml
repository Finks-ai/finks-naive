[project]
name = "finks-naive"
version = "0.1.0"
description = "Natural language to MongoDB query converter using multi-agent AI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[all]>=0.115.5",
    "uvicorn>=0.22.0",
    "pymongo>=4.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pydantic-ai>=0.0.14",
    "python-dotenv>=1.0.0",
    "mangum>=0.19.0",
    "loguru>=0.7.2",
    "httpx>=0.24.1",
    "typing-extensions>=4.11.0",
    "pulumi>=3.183.0",
    "pulumi-aws>=6.83.0",
    "pulumi-awsx>=2.22.0",
    "tqdm>=4.65.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.14.0",
    # Code quality
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "black>=24.10.0",
    "isort>=5.13.0",
    "bandit[toml]>=1.8.0",
    "safety>=3.2.0",
    # Pre-commit
    "pre-commit>=4.0.0",
    # Type stubs
    "types-PyYAML>=6.0.0",
    "types-requests>=2.32.0",
]

[tool.pytest.ini_options]
addopts = "--cov=app --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]

[tool.setuptools]
packages = ["app"]

# Ruff - Fast Python linter and formatter (replaces flake8, pylint, etc.)
[tool.ruff]
target-version = "py312"
line-length = 120
fix = true

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG",  # flake8-unused-arguments
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # Ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]  # Unused arguments in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# Black - Code formatter
[tool.black]
line-length = 120
target-version = ['py312']
include = '\.pyi?$'

# isort - Import sorter
[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

# MyPy - Static type checker
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
no_implicit_reexport = true
namespace_packages = true
show_error_codes = true
show_column_numbers = true
pretty = true

# Ignore missing imports for third-party libraries
[[tool.mypy.overrides]]
module = [
    "pymongo.*",
    "mangum.*",
    "loguru.*",
    "pulumi.*",
    "pulumi_aws.*",
    "pulumi_awsx.*",
]
ignore_missing_imports = true

# Bandit - Security linter
[tool.bandit]
targets = ["app"]
exclude_dirs = ["tests", "venv", ".venv"]
skips = ["B101"]  # Skip assert_used test
